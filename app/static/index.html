<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5fbf">
<title>Nguyên Quân</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
<!-- Đăng nhập -->
<main id="login" class="login" hidden>
  <form id="loginForm" class="login-card card" autocomplete="on">
    <div class="brand">
      <span class="logo" aria-hidden="true">NQ</span>
      <div><h1 id="loginCompany">NGUYÊN QUÂN</h1><p id="loginSub">Quản lý bán hàng</p></div>
    </div>
    <label for="lu">Tên đăng nhập</label>
    <input id="lu" name="username" autocomplete="username" required autofocus>
    <label for="lp">Mật khẩu</label>
    <input id="lp" name="password" type="password" autocomplete="current-password" required>
    <p id="loginErr" class="err" role="alert"></p>
    <button class="btn primary block" type="submit">Đăng nhập</button>
  </form>
</main>

<!-- Ứng dụng -->
<div id="shell" class="shell" hidden>
  <aside id="side" class="side" aria-label="Menu">
    <div class="side-head">
      <span class="logo" aria-hidden="true">NQ</span>
      <div class="side-brand"><b id="company">NGUYÊN QUÂN</b><small id="companySub"></small></div>
    </div>
    <nav id="nav" class="nav"></nav>
  </aside>
  <div id="scrim" class="scrim" hidden></div>
  <div class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Mở menu" aria-controls="side" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <h1 id="pageTitle" class="page-title">Trang chủ</h1>
      <div class="user-box">
        <button id="userBtn" class="user-btn" aria-haspopup="menu" aria-expanded="false">
          <span id="avatar" class="avatar" aria-hidden="true">A</span><span id="userName" class="user-name"></span>
        </button>
        <div id="userMenu" class="dropdown" role="menu" hidden>
          <button role="menuitem" data-act="password" class="local-only">Đổi mật khẩu</button>
          <button role="menuitem" data-act="refresh" class="admin-only">Làm mới cấu hình từ database</button>
          <button role="menuitem" data-act="logout">Đăng xuất</button>
        </div>
      </div>
    </header>
    <div id="view" class="view" tabindex="-1"></div>
  </div>
</div>

<dialog id="dlg" class="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/static/app.js?v=3"></script>
</body>
</html>
